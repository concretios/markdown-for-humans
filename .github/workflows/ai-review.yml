name: AI Code Review

# SECURITY NOTE — v2 reviewer trust model
# ---------------------------------------
# concretios/ai-pr-reviewer v2.0.0 refuses pull_request_target. That event
# exits success with the notice "Excluded event: pull_request_target", calls
# no model, and posts no review. The admitted events are pull_request,
# workflow_dispatch from the default branch, and an exact maintainer comment
# (see ai-review-request.yml).
#
# A pull_request from this repository receives GEMINI_API_KEY. Fork pull
# requests do not, and both the job condition and the action skip forks and
# Dependabot before any model call.
#
# Mitigations:
#   1. Every third-party action below is pinned to a full commit SHA, not a
#      movable tag. Do not use floating `@v2` here.
#   2. The top-level `permissions:` block is empty. The review job opts in to
#      contents:read, pull-requests:write, and actions:read. `id-token` is
#      not granted.
#   3. This workflow does not check out or execute PR code. The action
#      captures committed source itself.
#
# A same-repository collaborator can edit this file on their branch, and
# pull_request runs that copy. Collaborators are inside the v2 trust
# boundary; forks are not. Do not switch this workflow back to
# pull_request_target — v2 will keep reporting success while reviewing nothing.
#
# When updating action versions, look up the new commit SHA and pin to it,
# e.g. `gh api repos/<owner>/<repo>/git/refs/tags/<tag> --jq .object.sha`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true
        type: string
      review_mode:
        description: Review budget
        type: choice
        options: [auto, extended]
        default: extended
      publish:
        description: Publish findings
        type: boolean
        default: false

# Default to no permissions; each job opts in to exactly what it needs.
permissions: {}

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: >-
        ai-review-${{ github.repository_id }}-${{
          github.event.pull_request.number || inputs.pr_number
        }}-${{
          github.event_name == 'workflow_dispatch' && !inputs.publish &&
          format('pilot-{0}', github.run_id) || 'publish'
        }}
      cancel-in-progress: false
      queue: max
    steps:
      # concretios/ai-pr-reviewer@v2.0.0 — pinned to the immutable release SHA.
      - uses: concretios/ai-pr-reviewer@486ca9faf54287d4ac29c5c7bff5d20b2f53d558 # v2.0.0
        id: review
        with:
          github_token: ${{ github.token }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
          review_mode: ${{ inputs.review_mode || 'auto' }}
          publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.review.outputs.report_directory != ''
        with:
          name: ai-review-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.report_directory }}
          retention-days: 7

  skipped-event:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo 'AI review skipped. Fork and Dependabot PRs are excluded; no model calls made.' >> "$GITHUB_STEP_SUMMARY"
